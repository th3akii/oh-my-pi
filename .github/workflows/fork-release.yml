name: Fork Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable fork release version (X.Y.Z or vX.Y.Z)
        required: true
        type: string

concurrency:
  group: fork-windows-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORK_REPOSITORY: th3akii/oh-my-pi
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    name: Build and publish Windows x64 fork binary
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - name: Check out canonical fork main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: th3akii/oh-my-pi
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4"

      - name: Restore Bun dependency cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Capture and verify main source commit
        id: source
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          $main = (git rev-parse origin/main).Trim()
          if ($actual -ne $main) {
            throw "Checkout is not canonical origin/main: HEAD=$actual origin/main=$main"
          }
          $short = (git rev-parse --short=7 HEAD).Trim()
          "sha=$short" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Building canonical main commit $short"

      - name: Read canonical OMP version
        id: base
        shell: pwsh
        run: |
          $manifest = Get-Content "packages/utils/package.json" -Raw | ConvertFrom-Json
          $version = [string]$manifest.version
          if (-not $version) {
            throw "packages/utils/package.json has no application version"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Canonical OMP version is $version"

      - name: Validate exact upstream release version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          UPSTREAM_VERSION: ${{ steps.base.outputs.version }}
        run: |
          $validationOutput = (bun scripts/fork-release.ts validate-version $env:INPUT_VERSION $env:UPSTREAM_VERSION 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Release version validation failed: $validationOutput"
          }
          $version = $validationOutput
          if (-not $version) {
            throw "Release version validation returned no version"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Validated exact fork release version v$version"

      - name: Reject existing release and tag
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Absence is the expected result for both probes; capture their
          # statuses so PowerShell does not return gh/git's nonzero code.
          $tag = "v$env:RELEASE_VERSION"
          $missingReleaseExitCode = 1
          $missingTagExitCode = 2

          gh release view $tag --repo $env:FORK_REPOSITORY *> $null
          $releaseStatus = $LASTEXITCODE
          if ($releaseStatus -eq 0) {
            throw "GitHub release $tag already exists; refusing to overwrite it"
          }
          if ($releaseStatus -ne $missingReleaseExitCode) {
            throw "Could not check whether GitHub release $tag exists (exit code $releaseStatus)"
          }

          git ls-remote --exit-code origin "refs/tags/$tag" *> $null
          $tagStatus = $LASTEXITCODE
          if ($tagStatus -eq 0) {
            throw "Fork tag $tag already exists; refusing to reuse it"
          }
          if ($tagStatus -ne $missingTagExitCode) {
            throw "Could not check whether fork tag $tag exists (exit code $tagStatus)"
          }

          $global:LASTEXITCODE = 0

      - name: Verify integrated upstream base release
        shell: pwsh
        env:
          UPSTREAM_VERSION: ${{ steps.base.outputs.version }}
        run: |
          git remote add upstream https://github.com/can1357/oh-my-pi.git
          $tag = "v$env:UPSTREAM_VERSION"
          $tagProbe = (git ls-remote --exit-code --tags upstream "refs/tags/$tag" 2>&1 | Out-String).Trim()
          $tagStatus = $LASTEXITCODE
          if ($tagStatus -ne 0) {
            throw "Canonical main version $env:UPSTREAM_VERSION is not an official upstream release: $tagProbe"
          }
          $upstreamRef = "refs/remotes/upstream/release-$tag"
          git fetch --no-tags upstream "+refs/tags/$tag:$upstreamRef"
          $fetchStatus = $LASTEXITCODE
          if ($fetchStatus -ne 0) {
            throw "Could not fetch official upstream tag $tag (exit code $fetchStatus)"
          }
          git merge-base --is-ancestor $upstreamRef HEAD *> $null
          if ($LASTEXITCODE -ne 0) {
            throw "Official upstream release $tag is not integrated into canonical fork main"
          }
          Write-Host "$tag is the integrated upstream base release"

      - name: Build Windows x64 binary with existing release machinery
        env:
          RELEASE_TARGETS: win32-x64
          OMP_BUILD_VERSION: ${{ steps.version.outputs.version }}
          OMP_BUILD_COMMIT: ${{ steps.source.outputs.sha }}
        run: bun run ci:release:build-binaries

      - name: Verify binary version and immutable fork identity
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          BUILD_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          $binary = Join-Path $env:GITHUB_WORKSPACE "packages\coding-agent\binaries\omp-windows-x64.exe"
          if (-not (Test-Path -LiteralPath $binary)) {
            throw "Expected Windows release binary was not built: $binary"
          }
          $output = (& $binary --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Windows release binary --version failed: $output"
          }
          $expected = "omp/$env:RELEASE_VERSION (th3akii/oh-my-pi, $env:BUILD_COMMIT)"
          if ($output -ne $expected) {
            throw "Unexpected binary identity. Expected '$expected', received '$output'"
          }
          Write-Host $output

      - name: Publish exactly the Windows binary
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: main
          name: OMP ${{ steps.version.outputs.version }} (Windows fork build)
          body: |
            Windows x64 fork build for `th3akii/oh-my-pi`.

            - Source: `main` at `${{ steps.source.outputs.sha }}`
            - Binary identity: `omp/${{ steps.version.outputs.version }} (th3akii/oh-my-pi, ${{ steps.source.outputs.sha }})`
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: packages/coding-agent/binaries/omp-windows-x64.exe

      - name: Verify published release metadata and SHA-256 digest
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $releaseFile = Join-Path $env:RUNNER_TEMP "published-fork-release.json"
          gh api "repos/$env:FORK_REPOSITORY/releases/tags/v$env:RELEASE_VERSION" | Out-File -FilePath $releaseFile -Encoding utf8
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read the published GitHub release"
          }
          bun scripts/fork-release.ts verify-release $env:RELEASE_VERSION $releaseFile
          if ($LASTEXITCODE -ne 0) {
            throw "Published release metadata is not updater-compatible"
          }
